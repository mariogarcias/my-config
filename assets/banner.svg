<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Product Team AI Toolkit: AI agents and skills for Developers, QA and Product Owners">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <path d="M0 90H1280M0 180H1280M0 270H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#94A3B8" font-size="22" font-weight="600" letter-spacing="4">CLAUDE CODE PLUGIN · v1.0.0</text>
    <text x="80" y="190" fill="#F8FAFC" font-size="64" font-weight="800">Product Team <tspan fill="url(#accent)">AI Toolkit</tspan></text>
    <text x="80" y="238" fill="#CBD5E1" font-size="26">11 agents and 2 skills that take a feature from idea to release.</text>
    <g font-size="20" font-weight="700">
      <rect x="80" y="272" width="214" height="44" rx="22" fill="#1D4ED8"/>
      <text x="187" y="300" fill="#FFFFFF" text-anchor="middle">🧭 Product Owner</text>
      <rect x="310" y="272" width="120" height="44" rx="22" fill="#047857"/>
      <text x="370" y="300" fill="#FFFFFF" text-anchor="middle">✅ QA</text>
      <rect x="446" y="272" width="180" height="44" rx="22" fill="#C2410C"/>
      <text x="536" y="300" fill="#FFFFFF" text-anchor="middle">🛠 Developer</text>
    </g>
  </g>
  <g transform="translate(900 70)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <rect width="300" height="220" rx="14" fill="#020617" stroke="#334155"/>
    <circle cx="22" cy="22" r="6" fill="#EF4444"/><circle cx="42" cy="22" r="6" fill="#F59E0B"/><circle cx="62" cy="22" r="6" fill="#22C55E"/>
    <text x="20" y="68" fill="#64748B">&gt; idea</text>
    <text x="20" y="98" fill="#93C5FD">  product-backlog</text>
    <text x="20" y="128" fill="#6EE7B7">  qa-test-plan</text>
    <text x="20" y="158" fill="#FDBA74">  feature-tdd</text>
    <text x="20" y="188" fill="#F8FAFC">&gt; release 🚀</text>
  </g>
