name: Idea or new agent
description: Propose an improvement or a new agent, written as a user story.
labels: [enhancement]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      value: |
        As a ...
        I want ...
        so that ...
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: How will we know it works? Use Given / When / Then.
      placeholder: |
        1. Given ..., when ..., then ...
        2. Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why does it matter?
      description: The problem it solves, or an example of where you needed it.
